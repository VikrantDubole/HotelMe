services:
  hotel-service:
    image: hotelme-hotel-service:local
    container_name: hotel-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: ${HOTEL_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${HOTEL_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${HOTEL_DB_PASSWORD}
      CONFIG_SERVER_URL: http://config-server:8085
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      OKTA_ISSUER: ${OKTA_ISSUER}
      OKTA_AUDIENCE: ${OKTA_AUDIENCE}
    depends_on:
      - service-registry
      - config-server
    restart: unless-stopped

  service-registry:
    image: hotelme-service-registry:local
    container_name: service-registry
    ports:
      - "8761:8761"
    restart: unless-stopped

  config-server:
    image: hotelme-config-server:local
    container_name: config-server
    ports:
      - "8085:8085"
    environment:
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: https://github.com/VikrantDubole/HotelMeConfig.git
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: main
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
    restart: unless-stopped

  user-service:
    image: hotelme-user-service:local
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: ${USER_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
      CONFIG_SERVER_URL: http://config-server:8085
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      OKTA_ISSUER: ${OKTA_ISSUER}
      OKTA_AUDIENCE: ${OKTA_AUDIENCE}
      OKTA_CLIENT_ID: ${OKTA_CLIENT_ID}
      OKTA_CLIENT_SECRET: ${OKTA_CLIENT_SECRET}
    depends_on:
      - service-registry
      - config-server
    restart: unless-stopped

  rating-service:
    image: hotelme-rating-service:local
    container_name: rating-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATA_MONGODB_URI: ${RATING_MONGO_URI}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      OKTA_ISSUER: ${OKTA_ISSUER}
      OKTA_AUDIENCE: ${OKTA_AUDIENCE}
    depends_on:
      - service-registry
    restart: unless-stopped

  booking-service:
    image: hotelme-booking-service:local
    container_name: booking-service
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: ${BOOKING_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${BOOKING_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${BOOKING_DB_PASSWORD}
      CONFIG_SERVER_URL: http://config-server:8085
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      OKTA_ISSUER: ${OKTA_ISSUER}
    depends_on:
      - service-registry
      - config-server
    restart: unless-stopped

  payment-service:
    image: hotelme-payment-service:local
    container_name: payment-service
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: ${PAYMENT_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${PAYMENT_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD}
      CONFIG_SERVER_URL: http://config-server:8085
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      OKTA_ISSUER: ${OKTA_ISSUER}
    depends_on:
      - config-server
      - service-registry
    restart: unless-stopped

  api-gateway:
    image: hotelme-api-gateway:local
    container_name: api-gateway
    ports:
      - "8084:8084"
    environment:
      OKTA_ISSUER: ${OKTA_ISSUER}
      OKTA_AUDIENCE: ${OKTA_AUDIENCE}
      OKTA_CLIENT_ID: ${GATEWAY_OKTA_CLIENT_ID}
      OKTA_CLIENT_SECRET: ${GATEWAY_OKTA_CLIENT_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
    depends_on:
      - service-registry
      - user-service
      - hotel-service
      - rating-service
      - booking-service
      - payment-service
    restart: unless-stopped
