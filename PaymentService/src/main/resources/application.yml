server: {port: 8087}
spring:
  application: {name: PAYMENT-SERVICE}
  datasource: {url: "${PAYMENT_DB_URL:jdbc:postgresql://localhost:5434/payment}", username: "${PAYMENT_DB_USER:payment}", password: "${PAYMENT_DB_PASSWORD:payment}"}
  jpa: {hibernate: {ddl-auto: validate}}
  config: {import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8085}"}
  security: {oauth2: {resourceserver: {jwt: {issuer-uri: "${OKTA_ISSUER}"}}}}
eureka: {client: {service-url: {defaultZone: "${EUREKA_URL:http://localhost:8761/eureka}"}}}
payment: {provider: "${PAYMENT_PROVIDER:simulated}"}
management: {endpoints: {web: {exposure: {include: "health,info,metrics"}}}, endpoint: {health: {probes: {enabled: true}}}}
