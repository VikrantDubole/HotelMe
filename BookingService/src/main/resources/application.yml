server:
  port: 8086
spring:
  application:
    name: BOOKING-SERVICE
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:5433/booking}
    username: ${BOOKING_DB_USER:booking}
    password: ${BOOKING_DB_PASSWORD:booking}
  jpa:
    hibernate:
      ddl-auto: validate
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8085}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OKTA_ISSUER}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
